<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Realm | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="bg"></div>
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>
    <div class="particles" id="particles"></div>

    <header class="brand">
      <div class="wolf-mark">◈</div>
      <div>
        <strong>SHADOW REALM</strong>
        <span>Not just a login. A new beginning.</span>
      </div>
    </header>

    <main>
      <section class="login-card" id="loginCard">
        <div class="mini-mark">◈</div>
        <h1>WELCOME BACK</h1>
        <p class="subtitle">Log in to continue your journey</p>

        <form id="loginForm">
          <label class="field">
            <span>✉</span>
            <input type="text" placeholder="Username or Email" required>
          </label>

          <label class="field">
            <span>♙</span>
            <input id="password" type="password" placeholder="Password" required>
            <button type="button" class="eye" id="eye">◉</button>
          </label>

          <div class="options">
            <label><input type="checkbox" checked> <span>Remember me</span></label>
            <a href="#">Forgot password?</a>
          </div>

          <button class="login-btn" type="submit">
            <span>LOGIN</span><b>→</b>
          </button>

          <div class="or"><i></i><span>OR</span><i></i></div>
          <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
        </form>

        <div class="status" id="status"></div>
      </section>
    </main>

    <footer>DREAM &nbsp; / &nbsp; BUILD &nbsp; / &nbsp; CONQUER</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
